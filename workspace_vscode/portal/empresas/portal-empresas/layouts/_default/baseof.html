<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {{ if .IsHome }}
      Radar de Empresas
    {{ else }}
      {{ .Title }} • Radar de Empresas
    {{ end }}
  </title>

  <!-- CSS com cache-busting (pra dev não te trollar) -->
  <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}?v={{ now.Unix }}">
</head>
<body>
  <header class="top">
    <div class="wrap top_inner">
      <a class="brand" href="{{ "/" | relURL }}">Radar de Empresas</a>

      <nav class="nav">
        <a class="{{ if eq .Section "empresas" }}is-active{{ end }}" href="{{ "/empresas/" | relURL }}">Empresas</a>
        <a class="{{ if eq .RelPermalink ("/indice/" | relURL) }}is-active{{ end }}" href="{{ "/indice/" | relURL }}">Índice</a>
        <a class="{{ if eq .RelPermalink ("/categorias/" | relURL) }}is-active{{ end }}" href="{{ "/categorias/" | relURL }}">Categorias</a>
        <a class="{{ if eq .RelPermalink ("/historico/" | relURL) }}is-active{{ end }}" href="{{ "/historico/" | relURL }}">Histórico</a>
      </nav>
    </div>
  </header>

  <!-- IMPORTANTÍSSIMO: a âncora global que evita “CSS some” -->
  <main class="wrap site">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="foot">
    <div class="wrap foot_inner">
      <span>Atualizado: {{ now.Format "2006-01-02" }}</span>
    </div>
  </footer>
</body>
</html>
